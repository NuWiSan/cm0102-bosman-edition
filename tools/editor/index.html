<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CM 01/02 Editor</title>
<style>
  :root {
    --navy: #10106a; --navy2: #1c1c8c; --purple: #20006a; --red: #d80000; --yellow: #f8f800;
    --grey: #a0a0a0; --panel: rgba(8, 8, 24, 0.82); --line: #2c2c48; --white: #f0f0f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; color: var(--white); font: 14px "Trebuchet MS", Tahoma, sans-serif;
    background: #050510 radial-gradient(ellipse at 60% 30%, #1a1a2c 0%, #050510 70%);
  }
  #side { width: 150px; background: linear-gradient(#141488, #0a0a50); border-right: 2px solid #000;
    display: flex; flex-direction: column; padding: 8px 6px; gap: 6px; }
  #side .brand { color: var(--yellow); text-align: center; font-weight: bold; padding: 8px 0 12px; line-height: 1.3; }
  #side button { background: linear-gradient(#20209a, #10106a); border: 1px solid #000; color: var(--white);
    padding: 7px 6px; font: inherit; cursor: pointer; }
  #side button.on { color: var(--yellow); outline: 1px solid var(--yellow); }
  #side .info { margin-top: auto; color: var(--grey); font-size: 11px; word-break: break-all; }
  #col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #main { flex: 1; display: flex; flex-direction: column; padding: 10px 12px; gap: 8px; min-height: 0; }
  .heading { background: var(--red); border: 1px solid #000; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35);
    min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 12px;
    font-size: 26px; font-weight: bold; text-shadow: 2px 2px 0 #600; padding: 4px 12px; }
  .heading img { height: 46px; }
  .bar { display: flex; gap: 6px; align-items: center; }
  .bar input { flex: 1; background: #d8d8d8; border: 1px solid #000; padding: 6px 8px; font: inherit; }
  .btn { background: linear-gradient(#c8c8c8, #8c8c8c); border: 1px solid #000; color: #000; padding: 6px 14px;
    font: inherit; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: default; }
  .tabhead { background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; color: var(--yellow);
    text-align: center; font-weight: bold; font-size: 16px; }
  .list { flex: 1; overflow: auto; background: var(--panel); border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: linear-gradient(#c8c8c8, #8c8c8c); color: #000; font-weight: normal;
    padding: 4px 6px; text-align: left; border: 1px solid #000; }
  td { padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.v { color: var(--yellow); }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: rgba(80, 80, 200, .25); }
  .mini { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; }
  .dot { display: inline-block; width: 8px; height: 8px; border: 1px solid #000; vertical-align: middle; }
  .dot.yes { background: #3c3; } .dot.no { background: #555; }
  .record { flex: 1; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
  .panel h3 { margin: 0 0 8px; color: var(--yellow); font-size: 15px; }
  .fields td:first-child { color: var(--white); width: 40%; }
  .sizes { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; margin: 8px 0; }
  .sizes div { text-align: center; color: var(--grey); font-size: 11px; }
  .frame { width: 86px; height: 107px; border: 1px solid #c8c8d2; background: #10004a; overflow: hidden; }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .onbar { background: var(--red); padding: 4px 8px; }
  .onbar img { height: 46px; display: block; }
  code { color: var(--yellow); word-break: break-all; }
  .note { color: var(--grey); font-size: 12px; }
  .warn { color: #ff8060; }
  .pager { display: flex; gap: 6px; align-items: center; color: var(--grey); }
  .form td { padding: 2px 6px; }
  .form select { width: 100%; background: #d8d8d8; border: 1px solid #000; padding: 3px 6px; font: inherit; }
  .form select.colour { width: calc(100% - 28px); }
  .swatch { display: inline-block; width: 20px; height: 20px; margin-left: 6px; vertical-align: middle; border: 1px solid #000; }
  .form input { width: 100%; background: #d8d8d8; border: 1px solid #000; padding: 3px 6px; font: inherit; }
  .num { width: 54px !important; text-align: right; }
  .wnum { width: 120px !important; text-align: right; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 14px; }
  .grid2 label, .grid3 label, .grid4 label { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 14px; }
  .wide { grid-column: 1 / -1; }
  #savebar { display: none; background: var(--panel); border: 1px solid var(--yellow); margin: 10px 12px 0;
    padding: 6px 10px; gap: 8px; align-items: center; }
  #savebar input { background: #d8d8d8; border: 1px solid #000; padding: 4px 6px; font: inherit; }
  details summary { cursor: pointer; color: var(--grey); }
  .refbox { display: flex; gap: 4px; align-items: center; }
  .go { color: var(--yellow); text-decoration: none; font-weight: bold; padding: 0 4px; }
  .check { width: auto !important; }
  .swatch.big { width: 30px; height: 30px; margin: 0; }
  .people { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-bottom: 6px; }
  .people a { color: var(--yellow); text-decoration: none; }
  .hist { max-height: 420px; overflow: auto; }
  .hist td { padding: 1px 4px; }
  .hist input { width: 100%; background: #d8d8d8; border: 1px solid #000; padding: 2px 4px; font: inherit; }
  .hist .num { width: 60px !important; }
</style>
</head>
<body>
<div id="side">
  <div class="brand">CM 01/02<br>Editor</div>
  <button data-view="club">Clubs</button>
  <button data-view="person">People</button>
  <button data-view="nation">Nations</button>
  <button data-view="comp">Competitions</button>
  <button data-view="staff_comp">Awards</button>
  <button data-view="stadium">Stadiums</button>
  <button data-view="city">Cities</button>
  <button data-view="continent">Continents</button>
  <button data-view="colour">Colours</button>
  <button data-view="official">Officials</button>
  <button data-view="first">Names</button>
  <button data-view="pictures">Pictures</button>
  <div class="info" id="info"></div>
</div>
<div id="col">
  <div id="savebar"><span id="savecount"></span>
    <input id="savename" placeholder="Name of the new data set"><button class="btn" id="savego">Save as</button>
    <span class="note" id="savemsg"></span></div>
  <div id="main"></div>
</div>
<script>
"use strict";
const main = document.getElementById("main");
let info = {};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const api = async (path, opts) => { const r = await fetch(path, opts); return r.ok ? r.json() : null; };
const pictureUrl = (kind, name) => `/api/picture?kind=${kind}&name=${encodeURIComponent(name)}&t=${Date.now()}`;
const dmy = iso => iso ? iso.split("-").reverse().map(Number).join(".") : "";

const PAGE_TITLES = {first: "First names", second: "Second names", common: "Common names"};
const SIDE = {second: "first", common: "first"};

function setSide(view) {
  for (const b of document.querySelectorAll("#side button")) b.classList.toggle("on", b.dataset.view === (SIDE[view] || view));
}

async function showList(kind, q = "", offset = 0) {
  setSide(kind);
  const title = (info.tables.find(t => t.key === kind) || {}).title || kind;
  const names = ["first", "second", "common"].includes(kind) ? `<div class="bar">${["first", "second", "common"].map(k =>
    `<button class="btn" data-names="${k}" ${k === kind ? "disabled" : ""}>${PAGE_TITLES[k]}</button>`).join("")}</div>` : "";
  main.innerHTML = `<div class="heading">${esc(title)}</div>${names}
    <div class="bar"><input id="q" placeholder="Search" value="${esc(q)}"><button class="btn" id="go">Search</button></div>
    <div class="list" id="list"></div><div class="pager" id="pager"></div>`;
  for (const b of main.querySelectorAll("[data-names]")) b.onclick = () => { location.hash = b.dataset.names; };
  const input = document.getElementById("q");
  const run = (o = 0) => showList(kind, input.value, o);
  document.getElementById("go").onclick = () => run();
  input.onkeydown = e => { if (e.key === "Enter") run(); };
  input.focus();
  const res = await api(`/api/list/${kind}?q=${encodeURIComponent(q)}&offset=${offset}`);
  if (!res) return;
  const pic = res.rows.length && res.rows[0].picture;
  const list = document.getElementById("list");
  list.innerHTML = `<table><tr>${pic ? "<th></th>" : ""}<th>Name</th>${res.head.map(h => `<th>${esc(h)}</th>`).join("")}
    ${pic ? "<th>Picture</th>" : ""}</tr>${res.rows.map(r => `<tr class="row" data-id="${r.id}">
    ${pic ? `<td>${r.picture.has && r.picture.kind === "badge" ? `<img class="mini" src="${pictureUrl("badge", r.picture.name)}">` : ""}</td>` : ""}
    <td>${esc(r.name)}</td>${r.cols.map(c => `<td class="v">${esc(c)}</td>`).join("")}
    ${pic ? `<td><span class="dot ${r.picture.has ? "yes" : "no"}"></span></td>` : ""}</tr>`).join("")}</table>`;
  for (const tr of list.querySelectorAll("tr.row")) tr.onclick = () => { location.hash = `${kind}/${tr.dataset.id}`; };
  const pager = document.getElementById("pager");
  const last = Math.min(res.offset + res.rows.length, res.total);
  pager.innerHTML = `<span>${res.total ? res.offset + 1 : 0}–${last} of ${res.total}</span>` +
    (res.offset > 0 ? `<button class="btn" id="prev">Previous</button>` : "") +
    (last < res.total ? `<button class="btn" id="next">Next</button>` : "");
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  if (prev) prev.onclick = () => run(Math.max(0, res.offset - res.rows.length));
  if (next) next.onclick = () => run(last);
}

/* The input of one field. Links are a text input with suggestions; the picked id is kept in data-id. */
function fieldInput(f, prefix = "") {
  const key = prefix + f.key, dis = f.readonly ? " disabled" : "";
  switch (f.kind) {
    case "text": return `<input data-key="${key}" value="${esc(f.value)}" maxlength="${f.size}"${dis}>`;
    case "date": return `<input data-key="${key}" type="date" value="${esc(f.value)}"${dis}>`;
    case "flag": return `<input data-key="${key}" type="checkbox" class="check"${f.value ? " checked" : ""}${dis}>`;
    case "enum": return `<select data-key="${key}"${dis}>${f.choices.map(([k, n]) =>
      `<option value="${k}"${k === f.value ? " selected" : ""}>${esc(n)}</option>`).join("")}</select>`;
    case "colour": return `<select data-key="${key}" class="colour"${dis}>${[[-2, "None", ""], ...colours].map(([k, n, rgb]) =>
      `<option value="${k}" data-rgb="${rgb}"${k === f.value ? " selected" : ""}>${esc(n)}</option>`).join("")}${
      colours.some(c => c[0] === f.value) || f.value === -2 ? "" : `<option value="${f.value}" selected>(id ${f.value})</option>`}</select>
      <span class="swatch"></span>`;
    case "ref": case "name": case "staff":
      return `<span class="refbox"><input data-key="${key}" data-pick="${f.ref}" data-id="${f.value}" value="${esc(f.text)}"
        list="dl-${key.replace(/\W/g, "_")}"${dis}><datalist id="dl-${key.replace(/\W/g, "_")}"></datalist>${
        f.value >= 0 && OPENS[f.ref] ? `<a class="go" href="#${OPENS[f.ref]}/${f.value}" title="Open">›</a>` : ""}</span>`;
    default: return `<input data-key="${key}" class="${f.kind !== "int" ? "" : f.range && f.range[1] > 99999 ? "wnum" : "num"}"
      value="${esc(f.value)}"${dis}>`;
  }
}
const OPENS = {club: "club", person: "person", nation: "nation", comp: "comp", staff_comp: "staff_comp", stadium: "stadium",
               city: "city", continent: "continent", colour: "colour", first: "first", second: "second", common: "common"};
let colours = [];

/* The value of an input as the server takes it, or undefined for a link whose text is not a picked record. */
function inputValue(el) {
  if (el.type === "checkbox") return el.checked;
  if (el.dataset.pick !== undefined) return el.value === "" ? -1 : (el.dataset.ok === "0" ? undefined : +el.dataset.id);
  if (el.tagName === "SELECT") return +el.value;
  return el.value;
}

function wireInputs(root) {
  for (const el of root.querySelectorAll("[data-key]")) {
    el.addEventListener(el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input", () => el.dataset.dirty = "1");
  }
  for (const el of root.querySelectorAll("select.colour")) {
    const paint = () => { el.nextElementSibling.style.background = el.selectedOptions[0].dataset.rgb || "transparent"; };
    el.addEventListener("change", paint); paint();
  }
  for (const el of root.querySelectorAll("[data-pick]")) {
    const dl = document.getElementById(el.getAttribute("list"));
    el.addEventListener("input", async () => {
      const found = await api(`/api/pick/${el.dataset.pick}?q=${encodeURIComponent(el.value)}`) || [];
      dl.innerHTML = found.map(r => `<option value="${esc(r.name)}">`).join("");
      const hit = found.find(r => r.name === el.value);
      el.dataset.ok = hit || el.value === "" ? "1" : "0";
      if (hit) el.dataset.id = hit.id;
    });
  }
}

function dirtyValues(root, prefix = "") {
  const ch = {};
  for (const el of root.querySelectorAll("[data-key][data-dirty]")) {
    if (prefix && !el.dataset.key.startsWith(prefix)) continue;
    const v = inputValue(el);
    if (v === undefined) return {error: "Pick each link from the list."};
    ch[el.dataset.key.slice(prefix.length)] = v;
  }
  return {ch};
}

async function showRecord(kind, id) {
  setSide(kind);
  const rec = await api(`/api/rec/${kind}/${id}`);
  if (!rec) { main.innerHTML = `<div class="panel warn">No such record.</div>`; return; }
  const pic = rec.picture;
  const rows = f => `<tr><td>${esc(f.label)}</td><td>${fieldInput(f)}${f.note ? `<div class="note">${esc(f.note)}</div>` : ""}</td></tr>`;
  const big = s => s.fields.length > 12 && s.fields.every(f => f.kind === "int");
  const panel = s => big(s)
    ? `<div class="panel wide"><h3>${esc(s.title)}</h3><div class="grid4">${s.fields.map(f =>
        `<label>${esc(f.label)} ${fieldInput(f)}</label>`).join("")}</div></div>`
    : `<div class="panel"><h3>${esc(s.title)}</h3><table class="form">${s.fields.map(rows).join("")}</table></div>`;
  const staff = rec.staff ? `<div class="panel"><h3>Staff and squad</h3>${rec.staff.filter(x => x.people.length).map(x =>
      `<div class="note">${esc(x.title)}</div><div class="people">${x.people.map(p =>
        `<a href="#person/${p.id}">${esc(p.name)}</a>`).join("")}</div>`).join("")}
      <p class="note">A person joins or leaves a club on the person's page (Contract): the lists follow.</p></div>` : "";
  const hist = rec.history ? `<div class="panel wide"><h3>${esc(rec.history.title)}</h3>${rec.history.rows.length ?
      `<div class="hist"><table><tr>${rec.history.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${rec.history.rows.map(r =>
        `<tr data-row="${r.row}">${r.cells.map(c => `<td>${fieldInput(c, `h${r.row}.`)}</td>`).join("")}</tr>`).join("")}</table></div>`
      : '<p class="note">No rows.</p>'}</div>` : "";
  main.innerHTML = `<div class="heading">${pic && pic.has && pic.kind === "badge" ? `<img src="${pictureUrl("badge", pic.name)}">` : ""}${
      rec.rgb ? `<span class="swatch big" style="background:${rec.rgb}"></span>` : ""}${esc(rec.name)}</div>
    <div class="bar"><button class="btn" id="back">Back</button><button class="btn" id="apply">Apply changes</button>
      <span class="note" id="emsg"></span></div>
    <div class="record">${rec.sections.slice(0, 1).map(panel).join("")}${pic ? picturePanel(pic.kind, pic.name, pic.has) : ""}
      ${rec.sections.slice(1).map(panel).join("")}${staff}${hist}</div>
`;
  if (rec.locked) {
    const first = main.querySelector(".panel .form");
    if (first) first.insertAdjacentHTML("afterend", `<p class="note">${esc(rec.locked[0].toUpperCase() + rec.locked.slice(1))}.</p>`);
  }
  document.getElementById("back").onclick = () => history.back();
  if (pic) wirePicture(pic.kind, pic.name);
  wireInputs(main);
  document.getElementById("apply").onclick = async () => {
    const msg = document.getElementById("emsg");
    const say = (t, ok) => { msg.textContent = t; msg.className = ok ? "note" : "warn"; };
    const all = dirtyValues(main);
    if (all.error) return say(all.error);
    const own = {}, rowsCh = {};
    for (const [k, v] of Object.entries(all.ch)) {
      const m = /^h(\d+)\.(.*)$/.exec(k);
      if (m) (rowsCh[m[1]] = rowsCh[m[1]] || {})[m[2]] = v; else own[k] = v;
    }
    if (!Object.keys(own).length && !Object.keys(rowsCh).length) return say("Nothing changed.", true);
    if (Object.keys(own).length) {
      const r = await fetch(`/api/rec/${kind}/${id}`, {method: "POST", body: JSON.stringify(own)});
      if (!r.ok) return say((await r.json()).error);
    }
    for (const [row, ch] of Object.entries(rowsCh)) {
      const r = await fetch(`/api/history/${kind}/${row}`, {method: "POST", body: JSON.stringify(ch)});
      if (!r.ok) return say(`History: ${(await r.json()).error}`);
    }
    await showRecord(kind, id);
    say("Changed. Save writes a new data set.", true);
    refreshSaveBar();
  };
}

/* The picture panel: the file name that the game looks for, the picture at the game's sizes, and a new one from
   a PNG, SVG, WebP or JPEG file, made into a PNG here and saved under that name. */
function picturePanel(kind, name, has) {
  const folder = kind === "badge" ? "badges" : "faces";
  const shown = has ? pictureUrl(kind, name) : "";
  const sizes = kind === "badge"
    ? `<div><div class="onbar"><img id="p1" src="${shown}" ${has ? "" : 'style="visibility:hidden"'}></div>Heading</div>
       <div><img id="p2" class="mini" src="${shown}" ${has ? "" : 'style="visibility:hidden"'}><br>List</div>`
    : `<div><div class="frame"><img id="p1" src="${shown}" ${has ? "" : 'style="visibility:hidden"'}></div>Frame</div>`;
  return `<div class="panel"><h3>${kind === "badge" ? "Badge" : "Face"}</h3>
    <div class="note">The game looks for</div><code>${folder}/${esc(name)}.png</code>
    <div class="sizes">${sizes}</div>
    <div class="${has ? "note" : "warn"}" id="pstate">${has ? "Found: the game shows it." : "No picture yet."}</div>
    ${info.pictures ? `<div class="bar" style="margin-top:8px">
      <input type="file" id="pfile" accept=".png,.svg,.webp,.jpg,.jpeg,image/png,image/svg+xml,image/webp,image/jpeg">
      <button class="btn" id="psave" disabled>Save</button></div>
      <div class="note">PNG, SVG, WebP or JPEG; saved as PNG with the name above.</div>`
    : `<div class="warn">Start the editor with --user &lt;the game's user folder&gt; to save pictures.</div>`}</div>`;
}

function wirePicture(kind, name) {
  const file = document.getElementById("pfile"), save = document.getElementById("psave");
  if (!file) return;
  let blob = null;
  file.onchange = async () => {
    blob = file.files[0] ? await toPng(file.files[0]) : null;
    save.disabled = !blob;
    if (!blob) { document.getElementById("pstate").textContent = "This file could not be read."; return; }
    const url = URL.createObjectURL(blob);
    for (const id of ["p1", "p2"]) { const im = document.getElementById(id); if (im) { im.src = url; im.style.visibility = ""; } }
    document.getElementById("pstate").textContent = "Preview: Save writes it.";
    document.getElementById("pstate").className = "note";
  };
  save.onclick = async () => {
    const res = await api(`/api/picture?kind=${kind}&name=${encodeURIComponent(name)}`, {method: "POST", body: blob});
    document.getElementById("pstate").textContent = res ? `Saved as ${res.saved}.` : "Could not save.";
    document.getElementById("pstate").className = res ? "note" : "warn";
    save.disabled = !!res;
  };
}

/* Any picture file the browser reads, as a PNG blob; an SVG without a size is drawn 512 high. */
async function toPng(f) {
  const url = URL.createObjectURL(f);
  try {
    const img = new Image();
    await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = url; });
    let w = img.naturalWidth || 512, h = img.naturalHeight || 512;
    if (f.type === "image/svg+xml" || /\.svg$/i.test(f.name)) { const k = 512 / h; w = Math.round(w * k); h = 512; }
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    return await new Promise(ok => c.toBlob(ok, "image/png"));
  } catch (e) { return null; } finally { URL.revokeObjectURL(url); }
}

async function refreshSaveBar() {
  const i = await api("/api/info");
  const bar = document.getElementById("savebar");
  bar.style.display = i && i.changed ? "flex" : "none";
  document.getElementById("savecount").textContent = i ? `${i.changed} record(s) changed.` : "";
  if (!info.pictures) document.getElementById("savego").disabled = true;
}

async function showPictures() {
  setSide("pictures");
  const r = await api("/api/check");
  const what = kind => kind === "badge" ? "club" : "person";
  const part = (kind, x) => `<div class="panel"><h3>${kind === "badge" ? "Badges" : "Faces"}</h3>
    <div class="note">Folder</div><code>${esc(x.folder) || "-"}</code>
    <p>${x.shown} picture(s) that the game shows.</p>
    ${x.unknown.length ? `<p class="warn">PNG files whose name matches no ${what(kind)}:</p>
      <table>${x.unknown.map(u => `<tr><td>${esc(u.file)}</td><td>${u.like.length
        ? u.like.map(n => `<button class="btn" data-rename="${kind}" data-file="${esc(u.file)}" data-name="${esc(n)}">Rename to ${esc(n)}</button>`).join(" ")
        : '<span class="note">no close name: open the record and save the picture there</span>'}</td></tr>`).join("")}</table>` : ""}
    ${x.other.length ? `<p class="warn">Files that are not PNG (the game reads PNG only):</p>
      <table>${x.other.map(o => `<tr><td>${esc(o.file)}</td><td>${o.converted
        ? '<span class="note">converted: the PNG is there, this file can go</span>'
        : `<button class="btn" data-convert="${kind}" data-file="${esc(o.file)}">Convert to PNG</button>`}</td></tr>`).join("")}</table>` : ""}
    <p class="note" id="msg-${kind}"></p></div>`;
  main.innerHTML = `<div class="heading">Pictures</div>
    ${info.pictures ? `<div class="record">${part("badge", r.badge)}${part("face", r.face)}</div>`
      : `<div class="panel warn">Start the editor with --user &lt;the game's user folder&gt;.</div>`}`;
  for (const b of main.querySelectorAll("[data-rename]")) b.onclick = async () => {
    const k = b.dataset.rename;
    const res = await api(`/api/rename?kind=${k}&file=${encodeURIComponent(b.dataset.file)}&name=${encodeURIComponent(b.dataset.name)}`, {method: "POST"});
    if (res) showPictures(); else document.getElementById(`msg-${k}`).textContent = "Could not rename: a file with that name may exist.";
  };
  for (const b of main.querySelectorAll("[data-convert]")) b.onclick = async () => {
    const k = b.dataset.convert, f = b.dataset.file;
    const raw = await fetch(`/api/file?kind=${k}&file=${encodeURIComponent(f)}`);
    const blob = raw.ok ? await toPng(new File([await raw.blob()], f, {type: raw.headers.get("Content-Type")})) : null;
    const name = f.replace(/\.[^.]*$/, "");
    const res = blob ? await api(`/api/picture?kind=${k}&name=${encodeURIComponent(name)}`, {method: "POST", body: blob}) : null;
    if (res) showPictures(); else document.getElementById(`msg-${k}`).textContent = `Could not convert ${f}.`;
  };
}

function route() {
  const [view, arg] = location.hash.slice(1).split("/");
  setTimeout(refreshSaveBar, 0);
  if (view === "pictures") return showPictures();
  const kind = info.tables.some(t => t.key === view) ? view : "club";
  return arg !== undefined && arg !== "" ? showRecord(kind, arg) : showList(kind);
}
for (const b of document.querySelectorAll("#side button")) b.onclick = () => { location.hash = b.dataset.view; };
window.onhashchange = route;

document.getElementById("savego").onclick = async () => {
  const name = document.getElementById("savename").value.trim();
  const r = await fetch("/api/save", {method: "POST", body: JSON.stringify({name})});
  const res = await r.json();
  document.getElementById("savemsg").textContent = r.ok ? `Saved in ${res.saved}` : res.error;
  if (r.ok) { document.getElementById("savebar").style.display = "flex";
              document.getElementById("savecount").textContent = "Saved."; }
};

(async () => {
  info = await api("/api/info") || {tables: []};
  const c = await api("/api/list/colour?q=");
  colours = c ? c.rows.map(r => [r.id, r.name, "#" + r.cols.map(x => (+x).toString(16).padStart(2, "0")).join("")]) : [];
  document.getElementById("info").innerHTML = `Data:<br>${esc(info.data)}<br><br>Pictures:<br>${esc(info.pictures || "-")}`;
  route();
})();
</script>
